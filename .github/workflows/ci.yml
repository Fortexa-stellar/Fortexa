name: CI

on:
  push:
    branches: [main]
  pull_request:

# Disable Next.js anonymous telemetry reporting during CI builds and tests
# to prevent outbound network calls, avoid spurious tracking, and speed up CI execution.
env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
